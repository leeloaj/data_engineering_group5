# Creator Listening Analytics - local environment (Linux / WSL)
# First start:   cp .env.example .env   (edit it)   then   docker compose up -d --build
# Wipe all data: docker compose down -v

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile
    args:
      AIRFLOW_VERSION: ${AIRFLOW_VERSION:-2.8.1}
      DBT_POSTGRES_SPEC: ${DBT_POSTGRES_SPEC:-dbt-postgres}
  image: creator-analytics-airflow:${AIRFLOW_VERSION:-2.8.1}
  # Run as your own Linux user so files written to bind mounts belong to you
  user: "${AIRFLOW_UID:-1000}:0"
  # Passes every variable from .env (API tokens, Kaggle login, ...) into the containers
  env_file:
    - .env
  # Entries below override same-named variables from .env
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?Copy .env.example to .env first}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_WEBSERVER_SECRET_KEY:?Copy .env.example to .env first}
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@airflow-db:5432/${AIRFLOW_DB_NAME}
    AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth
    # Used by the ingestion loaders (bronze.py reads DATABASE_URL). Overrides a localhost value in .env.
    DATABASE_URL: postgresql://${WAREHOUSE_DB_USER}:${WAREHOUSE_DB_PASSWORD}@warehouse-db:5432/${WAREHOUSE_DB_NAME}
    # Airflow connection for DAGs: PostgresHook(postgres_conn_id="warehouse_db")
    AIRFLOW_CONN_WAREHOUSE_DB: postgres://${WAREHOUSE_DB_USER}:${WAREHOUSE_DB_PASSWORD}@warehouse-db:5432/${WAREHOUSE_DB_NAME}
    # Lets DAGs and shell tasks run `import ingestion...` / `python -m ingestion...`
    PYTHONPATH: /opt/airflow
    KAGGLEHUB_CACHE: /opt/airflow/kagglehub_cache
    # dbt reads the same warehouse settings via env_var() in profiles.yml
    WAREHOUSE_DB_HOST: warehouse-db
    WAREHOUSE_DB_PORT: "5432"
    DBT_PROJECT_DIR: /opt/airflow/dbt
    DBT_PROFILES_DIR: /opt/airflow/dbt
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/plugins:/opt/airflow/plugins
    - airflow_logs:/opt/airflow/logs
    # bronze.py finds sql/bronze.sql relative to the folder that holds ingestion/,
    # so these two must sit side by side
    - ./ingestion:/opt/airflow/ingestion
    - ./sql:/opt/airflow/sql
    - ./dbt:/opt/airflow/dbt
    - ./data:/opt/airflow/data:ro
    - kagglehub_cache:/opt/airflow/kagglehub_cache

services:
  # PostgreSQL #1: Airflow's own metadata (DAG runs, task states, users)
  airflow-db:
    image: postgres:${POSTGRES_VERSION:-16.4}
    container_name: airflow-db
    environment:
      POSTGRES_USER: ${AIRFLOW_DB_USER}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      POSTGRES_DB: ${AIRFLOW_DB_NAME}
    volumes:
      - airflow_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # PostgreSQL #2: the warehouse. The loaders create the bronze schema themselves.
  warehouse-db:
    image: postgres:${POSTGRES_VERSION:-16.4}
    container_name: warehouse-db
    environment:
      POSTGRES_USER: ${WAREHOUSE_DB_USER}
      POSTGRES_PASSWORD: ${WAREHOUSE_DB_PASSWORD}
      POSTGRES_DB: ${WAREHOUSE_DB_NAME}
    ports:
      - "${WAREHOUSE_DB_PORT:-5433}:5432"   # for psql / DBeaver / loaders run on your own machine
    volumes:
      - warehouse_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # One-shot job: migrate the Airflow database and create the admin user, then exit
  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    command:
      - bash
      - -c
      - |
        set -e

        echo "Running Airflow database migrations..."
        airflow db migrate

        echo "Creating Airflow admin user..."
        airflow users create \
          --username "$$AIRFLOW_ADMIN_USER" \
          --password "$$AIRFLOW_ADMIN_PASSWORD" \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email "$$AIRFLOW_ADMIN_EMAIL" || true

        echo "Airflow initialization completed."

    depends_on:
      airflow-db:
        condition: service_healthy
      warehouse-db:
        condition: service_healthy

    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    container_name: airflow-webserver
    command: webserver
    ports:
      - "${AIRFLOW_WEB_PORT:-8080}:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  # With LocalExecutor the scheduler runs the tasks, so it needs the same mounts and env
  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

# Named volumes: Docker manages the files, so there are no permission problems
volumes:
  airflow_db_data:
  warehouse_db_data:
  airflow_logs:
  kagglehub_cache: