name: creator_analytics
version: "0.1.0"
config-version: 2

profile: creator_analytics

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # Calendar range generated by dim_date (Kaggle history starts 2017).
  dim_date_start: "2017-01-01"
  dim_date_end: "2030-12-31"

models:
  creator_analytics:
    silver:
      +schema: silver
      +materialized: view
    gold:
      +schema: gold
      +materialized: table

seeds:
  creator_analytics:
    +schema: gold
