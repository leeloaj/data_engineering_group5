version: 2

models:
  - name: stg_chart_entries
    description: >
      Chart observations from live Spotify Charts and the Kaggle archive, with
      track and artist names extracted from raw_row. When both sources cover
      the same chart, the live row wins. Grain: one track x region x chart
      type x date. Keys, ranks, streams and allowed values are tested on the
      bronze source; the grain is tested on fact_track_performance.
    columns:
      - name: chart_date
        description: Chart date.
      - name: region_code
        description: Region code ("GLOBAL", "EE", ...).
      - name: chart_type
        description: "'top200', 'viral50' or 'top200_weekly'."
      - name: track_id
        description: Spotify track ID.
      - name: track_name
        description: Track title as shown on the chart.
      - name: artist_names
        description: Artist names as shown on the chart (free text, comma-separated).
      - name: chart_position
        description: Chart position.
      - name: streams
        description: Streams; NULL for charts without stream counts (viral50) or when the source left it blank.
      - name: chart_source
        description: "'spotify_charts' or 'kaggle_spotify_charts'."
      - name: input_file
        description: File the row came from.
      - name: ingested_at
        description: When the row was loaded into bronze; drives incremental loads.

  - name: stg_spotify_track_snapshots
    description: >
      Spotify Web API track metadata. Grain: one track x snapshot date (each
      enrichment run is a snapshot). is_latest marks each track's newest one.
    data_tests:
      - unique_combination:
          arguments:
            columns: [track_id, snapshot_date]
    columns:
      - name: track_id
        description: Requested Spotify track ID (matches the chart data even if Spotify relinked it).
        data_tests: [not_null]
      - name: snapshot_date
        description: Enrichment snapshot date.
        data_tests: [not_null]
      - name: market
        description: Spotify catalog market the track was fetched for.
      - name: track_title
        description: Spotify track name.
      - name: duration_ms
        description: Track length in milliseconds.
      - name: explicit
        description: True if the track has explicit lyrics.
      - name: album_id
        description: Spotify album ID.
      - name: album_name
        description: Album name.
      - name: popularity
        description: Spotify popularity score at the snapshot (0-100).
        data_tests:
          - value_between:
              arguments:
                min_value: 0
                max_value: 100
      - name: release_date
        description: Album release date; year/month precision dates use the first day of the period.
      - name: release_date_precision
        description: "'day', 'month' or 'year'."
      - name: artists
        description: Spotify artists array (JSON), in credit order.
      - name: ingested_at
        description: UTC time the bronze row was loaded.
      - name: is_latest
        description: True for the track's newest snapshot.

  - name: stg_spotify_track_artists
    description: One row per track x credited artist, from the latest snapshot.
    data_tests:
      - unique_combination:
          arguments:
            columns: [track_id, artist_id]
    columns:
      - name: track_id
        description: Spotify track ID.
        data_tests: [not_null]
      - name: artist_id
        description: Spotify artist ID.
        data_tests: [not_null]
      - name: artist_name
        description: Artist name.
        data_tests: [not_null]
      - name: artist_order
        description: Position in the credits; 1 = primary artist.
        data_tests: [not_null]
      - name: snapshot_date
        description: Spotify snapshot the credits come from.

  - name: stg_chart_tracks
    description: >
      One row per track seen on any chart, with the names from its most recent
      chart row. A table (not a view) so the chart history is scanned once.
    columns:
      - name: track_id
        description: Spotify track ID.
        data_tests: [unique, not_null]
      - name: track_name
        description: Track name from the chart file.
      - name: artist_names
        description: Comma-separated artist names from the chart file.
      - name: last_chart_date
        description: Most recent date the track appeared on any chart.
        data_tests: [not_null]

  - name: stg_chart_track_artists
    description: >
      One row per track x artist name, split from the comma-separated artist
      names on each track's most recent chart row. Used for tracks without
      Spotify metadata. Names that contain a comma are split as well.
    data_tests:
      - unique_combination:
          arguments:
            columns: [track_id, artist_name]
      - unique_combination:
          arguments:
            columns: [track_id, artist_order]
    columns:
      - name: track_id
        description: Spotify track ID.
        data_tests: [not_null]
      - name: artist_name
        description: Artist name as written in the chart file.
        data_tests: [not_null]
      - name: artist_order
        description: Position in the chart's artist list; 1 = first-listed artist.
        data_tests: [not_null]

  - name: stg_track_artists
    description: >
      One row per track x credited artist. Spotify artists for tracks with
      Spotify metadata, chart artist names (artist_id 'chart:<name>') for the
      rest. Source for dim_artist and bridge_track_artist.
    data_tests:
      - unique_combination:
          arguments:
            columns: [track_id, artist_id]
    columns:
      - name: track_id
        description: Spotify track ID.
        data_tests: [not_null]
      - name: artist_id
        description: Spotify artist ID, or 'chart:<name>' for chart-only artists.
        data_tests: [not_null]
      - name: artist_name
        description: Artist name.
        data_tests: [not_null]
      - name: artist_order
        description: Position in the credits; 1 = primary artist.
        data_tests: [not_null]
      - name: has_spotify_metadata
        description: True if the artist comes from Spotify, false if from the chart files.
        data_tests: [not_null]
      - name: snapshot_date
        description: Spotify snapshot date; NULL for chart artists.

  - name: stg_audio_features
    description: ReccoBeats audio features, one row per track (latest snapshot).
    columns:
      - name: track_id
        description: Spotify track ID.
        data_tests: [unique, not_null]
      - name: danceability
        description: 0-1.
        data_tests:
          - value_between:
              arguments: {min_value: 0, max_value: 1}
      - name: energy
        description: 0-1.
        data_tests:
          - value_between:
              arguments: {min_value: 0, max_value: 1}
      - name: valence
        description: 0-1.
        data_tests:
          - value_between:
              arguments: {min_value: 0, max_value: 1}
      - name: tempo
        description: Beats per minute.
      - name: loudness
        description: Decibels (usually negative).
      - name: snapshot_date
        description: Enrichment snapshot date of these features.
      - name: acousticness
        description: 0-1.
        data_tests:
          - value_between:
              arguments: {min_value: 0, max_value: 1}
      - name: instrumentalness
        description: 0-1.
        data_tests:
          - value_between:
              arguments: {min_value: 0, max_value: 1}
      - name: liveness
        description: 0-1.
        data_tests:
          - value_between:
              arguments: {min_value: 0, max_value: 1}
      - name: speechiness
        description: 0-1.
        data_tests:
          - value_between:
              arguments: {min_value: 0, max_value: 1}
      - name: musical_key
        description: Pitch class (0 = C, 1 = C#, ... 11 = B; -1 if not detected).
      - name: mode
        description: 1 = major, 0 = minor.
      - name: isrc
        description: International Standard Recording Code of the recording.
